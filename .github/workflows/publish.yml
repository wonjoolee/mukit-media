name: MUKIT publish

on:
  schedule:
    - cron: "50 22 * * *"   # 07:50 KST
    - cron: "30 3 * * *"    # 12:30 KST
    - cron: "30 12 * * *"   # 21:30 KST
  workflow_dispatch:
    inputs:
      slot:
        description: "slot 1/2/3 (비우면 현재 시간 기준)"
        required: false
      story_only:
        description: "스토리만 게시할 폴더 (예: queue/2026-11-03/slot1)"
        required: false
      dry_run:
        description: "1이면 게시하지 않고 확인만"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: mukit-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish queued post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SLOT: ${{ github.event.inputs.slot }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          STORY_ONLY: ${{ github.event.inputs.story_only }}
        run: python pipeline/run_slot.py
      - name: Save posted record
        run: |
          git config user.name "MUKIT bot"
          git config user.email "mukit-bot@users.noreply.github.com"
          git add queue || true
          git diff --cached --quiet || (git commit -m "posted $(TZ=Asia/Seoul date +%F-%H%M)" && git pull --rebase && git push)
